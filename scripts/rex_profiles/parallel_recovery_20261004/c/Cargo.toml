[package]
name = "rex-cfg"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "CFG parcial por analise de fluxo delimitada (rex-cfg/v1). Consome rex-gameplay por path, somente-leitura. Experimental."
license = "UNLICENSED"
publish = false

# Sem dependencias externas: reutiliza o subconjunto m68k, o JSON e o SHA-256
# de rex-gameplay (mesma convencion dos paquetes REX paralelos).
[dependencies]
rex-gameplay = { path = "../../../../crates/rex-gameplay" }

[dev-dependencies]

[lib]
name = "rex_cfg"
path = "src/lib.rs"

[[bin]]
name = "rex-cfg"
path = "src/main.rs"
